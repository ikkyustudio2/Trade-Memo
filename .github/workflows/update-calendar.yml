name: Update economic calendar

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch-calendar.mjs
      - name: Commit if changed
        run: |
          git config user.name "trade-memo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calendar.json
          git diff --cached --quiet || git commit -m "Update economic calendar data"
          git push
